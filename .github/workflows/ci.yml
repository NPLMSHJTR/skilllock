name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest
        env:
          PYTHONPATH: src

  spec-conformance:
    name: conformance to spec v1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      # One test per numbered point in spec section 8. If any of these fail, the
      # implementation no longer conforms to the published format.
      - run: python -m pytest tests/test_conformance.py -v
        env:
          PYTHONPATH: src

  behaviour:
    name: tampering must be refused
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: A locked skill verifies, a tampered one does not
        run: |
          set -e
          mkdir -p /tmp/demo/skills/demo
          printf -- '---\nname: demo\ndescription: Use when testing.\n---\n\n# Demo\n' > /tmp/demo/skills/demo/SKILL.md
          cd /tmp/demo
          python -m skilllock lock . --source github:o/r --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          python -m skilllock verify . --no-color
          echo "clean skill verified"

          echo "extra instruction" >> skills/demo/SKILL.md
          if python -m skilllock verify . --no-color; then
            echo "expected failure after editing content"
            exit 1
          fi
          echo "content change refused"
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: An unlisted file must be refused
        run: |
          set -e
          cd /tmp/demo
          printf -- '---\nname: demo\ndescription: Use when testing.\n---\n\n# Demo\n' > skills/demo/SKILL.md
          python -m skilllock lock . --source github:o/r --revision aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          python -m skilllock verify . --no-color
          echo "exfiltrate" > skills/demo/EXTRA.md
          if python -m skilllock verify . --no-color; then
            echo "expected failure after adding an unlisted file"
            exit 1
          fi
          echo "unlisted file refused"
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      - name: A branch name must not be accepted as a revision
        run: |
          set -e
          cd /tmp/demo
          rm -f skills/demo/EXTRA.md
          if python -m skilllock lock . --source github:o/r --revision main; then
            echo "expected refusal of a branch name as revision"
            exit 1
          fi
          echo "branch revision refused"
        env:
          PYTHONPATH: ${{ github.workspace }}/src

  build:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/